<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Streak">
<meta name="theme-color" content="#111418">
<title>Streak — Workout Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0e1115;
    --bg2: #13171d;
    --bg3: #1a1f27;
    --surface: rgba(255,255,255,0.04);
    --surface-hover: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.07);
    --border-strong: rgba(255,255,255,0.14);
    --text: #e8eaf0;
    --text-dim: #7a8194;
    --text-faint: #424857;
    --green: #4ade80;
    --green-glow: rgba(74,222,128,0.18);
    --green-dim: rgba(74,222,128,0.4);
    --yellow: #fbbf24;
    --yellow-glow: rgba(251,191,36,0.18);
    --red: #f87171;
    --red-glow: rgba(248,113,113,0.18);
    --accent: #818cf8;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    overscroll-behavior: none;
  }

  body {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ── App Shell ── */
  #app {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    padding: 0 0 80px;
  }

  /* ── Header ── */
  header {
    padding: 52px 24px 20px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
  }

  .header-left h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .header-left .week-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
    letter-spacing: 0.08em;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    padding-top: 2px;
  }

  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
  .icon-btn svg { width: 17px; height: 17px; }

  /* ── Status Light ── */
  .status-bar {
    margin: 0 24px 28px;
    padding: 16px 20px;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.4s ease;
  }
  .status-bar.red   { border-color: rgba(248,113,113,0.25); background: rgba(248,113,113,0.06); }
  .status-bar.yellow{ border-color: rgba(251,191,36,0.25);  background: rgba(251,191,36,0.06); }
  .status-bar.green { border-color: rgba(74,222,128,0.25);  background: rgba(74,222,128,0.06); }

  .status-light {
    width: 14px; height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: all 0.4s;
    position: relative;
  }
  .status-light::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    opacity: 0.4;
    transition: all 0.4s;
  }
  .status-bar.red    .status-light { background: var(--red);    box-shadow: 0 0 12px var(--red); }
  .status-bar.red    .status-light::after { background: var(--red); filter: blur(6px); }
  .status-bar.yellow .status-light { background: var(--yellow); box-shadow: 0 0 12px var(--yellow); }
  .status-bar.yellow .status-light::after { background: var(--yellow); filter: blur(6px); }
  .status-bar.green  .status-light { background: var(--green);  box-shadow: 0 0 12px var(--green); }
  .status-bar.green  .status-light::after { background: var(--green); filter: blur(6px); }

  .status-text { flex: 1; }
  .status-text .label {
    font-size: 13px;
    font-weight: 600;
    line-height: 1;
  }
  .status-bar.red    .label { color: var(--red); }
  .status-bar.yellow .label { color: var(--yellow); }
  .status-bar.green  .label { color: var(--green); }
  .status-text .sublabel {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 3px;
  }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    margin: 0 24px 24px;
    background: var(--surface);
    border-radius: var(--radius-sm);
    padding: 4px;
    border: 1px solid var(--border);
    gap: 2px;
  }
  .tab {
    flex: 1; padding: 9px 8px;
    border-radius: 8px;
    font-size: 13px; font-weight: 600;
    cursor: pointer;
    text-align: center;
    color: var(--text-dim);
    transition: all 0.2s;
    border: none; background: transparent;
  }
  .tab.active {
    background: var(--bg3);
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }

  /* ── Tab Views ── */
  .view { display: none; padding: 0 24px; }
  .view.active { display: block; }

  /* ── Section ── */
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .section-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .section-badge.green { color: var(--green); border-color: var(--green-dim); }

  /* ── Workout Item ── */
  .workout-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }

  .workout-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    transition: all 0.25s;
    position: relative;
    overflow: hidden;
  }
  .workout-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--green-glow);
    opacity: 0;
    transition: opacity 0.4s;
  }
  .workout-item.checked { border-color: rgba(74,222,128,0.22); }
  .workout-item.checked::before { opacity: 1; }

  /* custom checkbox */
  .check-box {
    width: 26px; height: 26px;
    border-radius: 8px;
    border: 1.5px solid var(--border-strong);
    background: var(--bg3);
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s;
    position: relative;
    z-index: 1;
  }
  .check-box svg { opacity: 0; transform: scale(0.4); transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1); }
  .workout-item.checked .check-box {
    background: var(--green);
    border-color: var(--green);
    box-shadow: 0 0 12px var(--green-glow);
  }
  .workout-item.checked .check-box svg { opacity: 1; transform: scale(1); }

  .workout-name {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    transition: all 0.3s;
    position: relative;
    z-index: 1;
  }
  .workout-name::after {
    content: '';
    position: absolute;
    left: 0; top: 50%;
    width: 0; height: 1.5px;
    background: var(--text-dim);
    transition: width 0.35s ease;
  }
  .workout-item.checked .workout-name { color: var(--text-dim); }
  .workout-item.checked .workout-name::after { width: 100%; }

  .workout-actions {
    display: flex; gap: 6px;
    position: relative; z-index: 1;
  }
  .item-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: none; background: transparent;
    color: var(--text-faint);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.18s;
    font-size: 11px;
  }
  .item-btn:hover { background: var(--surface-hover); color: var(--text-dim); }
  .item-btn.danger:hover { color: var(--red); background: var(--red-glow); }
  .item-btn svg { width: 14px; height: 14px; }

  /* ── Add Workout Form ── */
  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .add-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 500;
    outline: none;
    transition: border-color 0.2s;
  }
  .add-input:focus { border-color: var(--border-strong); }
  .add-input::placeholder { color: var(--text-faint); }

  .add-btn {
    padding: 11px 16px;
    background: var(--accent);
    color: white;
    border: none; border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-size: 13px; font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .add-btn:hover { opacity: 0.85; }

  .type-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .type-chip {
    flex: 1;
    padding: 8px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-family: 'Syne', sans-serif;
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.18s;
  }
  .type-chip.selected-necessary {
    border-color: var(--red);
    color: var(--red);
    background: var(--red-glow);
  }
  .type-chip.selected-optional {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(129,140,248,0.1);
  }

  /* ── History ── */
  .history-list { display: flex; flex-direction: column; gap: 10px; }

  .history-item {
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 12px;
    align-items: center;
  }
  .history-dot {
    width: 12px; height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .history-dot.green { background: var(--green); box-shadow: 0 0 8px var(--green-glow); }
  .history-dot.yellow { background: var(--yellow); box-shadow: 0 0 8px var(--yellow-glow); }
  .history-dot.red { background: var(--red); box-shadow: 0 0 8px var(--red-glow); }

  .history-info .week { font-size: 13px; font-weight: 700; }
  .history-info .score {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
  }
  .history-pct {
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    font-weight: 500;
    color: var(--text-dim);
  }

  .empty-state {
    text-align: center;
    padding: 48px 24px;
    color: var(--text-faint);
    font-size: 13px;
    line-height: 1.6;
  }
  .empty-state .icon { font-size: 32px; margin-bottom: 12px; }

  /* ── Settings Panel (modal) ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    z-index: 100;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    width: 100%; max-width: 480px;
    background: var(--bg2);
    border-radius: 20px 20px 0 0;
    border-top: 1px solid var(--border);
    padding: 24px 24px 40px;
    animation: slideUp 0.3s cubic-bezier(0.32,0.72,0,1);
  }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  .modal-handle {
    width: 40px; height: 4px;
    border-radius: 2px;
    background: var(--border-strong);
    margin: 0 auto 20px;
  }
  .modal-title {
    font-size: 18px; font-weight: 800;
    margin-bottom: 20px;
  }
  .modal-btn {
    width: 100%;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    text-align: left;
    display: flex; align-items: center; gap: 12px;
    transition: all 0.18s;
    margin-bottom: 10px;
  }
  .modal-btn:hover { background: var(--surface-hover); }
  .modal-btn.danger { color: var(--red); }
  .modal-btn svg { width: 18px; height: 18px; opacity: 0.6; }

  /* ── Bottom Nav ── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 100%; max-width: 480px;
    height: 72px;
    background: rgba(14,17,21,0.9);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
    padding: 0 16px;
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 50;
  }

  /* ── Scrollable content ── */
  .view { overflow-y: auto; }

  /* ── Rename inline ── */
  .rename-input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--accent);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 15px; font-weight: 600;
    outline: none;
    padding: 2px 0;
  }

  /* ── Progress ring on status ── */
  .progress-ring {
    position: relative;
    width: 42px; height: 42px;
    flex-shrink: 0;
  }
  .progress-ring svg { transform: rotate(-90deg); }
  .progress-ring .track { fill: none; stroke: var(--border-strong); stroke-width: 3; }
  .progress-ring .fill  { fill: none; stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
  .ring-label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 10px; font-weight: 500;
    color: var(--text);
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f0f2f5;
      --bg2: #e8eaed;
      --bg3: #dde0e5;
      --surface: rgba(0,0,0,0.04);
      --surface-hover: rgba(0,0,0,0.07);
      --border: rgba(0,0,0,0.08);
      --border-strong: rgba(0,0,0,0.14);
      --text: #1a1d24;
      --text-dim: #6b7280;
      --text-faint: #9ca3af;
    }
  }
</style>
</head>
<body>

<div id="app">

  <header>
    <div class="header-left">
      <h1>Streak</h1>
      <div class="week-label" id="weekLabel">Loading…</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="openSettings()" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- Status Bar -->
  <div class="status-bar red" id="statusBar">
    <div class="progress-ring" id="progressRing">
      <svg width="42" height="42" viewBox="0 0 42 42">
        <circle class="track" cx="21" cy="21" r="17"/>
        <circle class="fill" id="ringFill" cx="21" cy="21" r="17" stroke="var(--red)"
          stroke-dasharray="106.8" stroke-dashoffset="106.8"/>
      </svg>
      <div class="ring-label" id="ringLabel">0%</div>
    </div>
    <div class="status-text">
      <div class="label" id="statusLabel">Not started</div>
      <div class="sublabel" id="statusSub">Complete your non-negotiables</div>
    </div>
    <div class="status-light" id="statusLight"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('today',this)">Today</button>
    <button class="tab" onclick="switchTab('history',this)">History</button>
  </div>

  <!-- Today View -->
  <div class="view active" id="view-today">

    <!-- Non-Negotiables -->
    <div class="section-header">
      <div class="section-title">Non-Negotiables</div>
      <div class="section-badge" id="necBadge">0 / 0</div>
    </div>
    <div class="workout-list" id="necList"></div>

    <!-- Add workout -->
    <div style="margin-bottom:28px">
      <div class="add-form" id="addForm">
        <input class="add-input" id="addInput" placeholder="e.g. Morning run…" maxlength="50" onkeydown="if(event.key==='Enter')addWorkout()">
        <button class="add-btn" onclick="addWorkout()">Add</button>
      </div>
      <div class="type-toggle">
        <button class="type-chip selected-necessary" id="chipNec" onclick="selectType('necessary')">⚡ Non-Negotiable</button>
        <button class="type-chip" id="chipOpt" onclick="selectType('optional')">✦ Bonus</button>
      </div>
    </div>

    <!-- Bonus -->
    <div class="section-header">
      <div class="section-title">Bonus Workouts</div>
      <div class="section-badge" id="optBadge">0 / 0</div>
    </div>
    <div class="workout-list" id="optList"></div>

  </div>

  <!-- History View -->
  <div class="view" id="view-history">
    <div class="section-header" style="margin-bottom:16px">
      <div class="section-title">Past Performance</div>
    </div>
    <div id="historyList" class="history-list"></div>
  </div>

</div>

<!-- Settings Modal -->
<div class="modal-backdrop" id="settingsModal" onclick="closeSettings(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">Settings</div>

    <button class="modal-btn" onclick="exportHistory()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Export History (JSON)
    </button>

    <button class="modal-btn" onclick="importHistory()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Import History (JSON)
    </button>

    <button class="modal-btn danger" onclick="confirmReset()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6m4-6v6"/><path d="M9 6V4h6v2"/></svg>
      Reset All Data
    </button>

    <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
  </div>
</div>

<script>
// ─── State & Storage ───────────────────────────────────────────────

const KEYS = { workouts: 'streak_workouts', history: 'streak_history', week: 'streak_week' };
let newItemType = 'necessary';

function load(k, def) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; }
}
function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

function getWeekKey(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  // Monday-based week
  const day = d.getDay() || 7;
  d.setDate(d.getDate() - day + 1);
  // Use local date parts to avoid UTC timezone shift
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function getISOWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function formatWeek(isoKey) {
  const d = new Date(isoKey + 'T00:00:00');
  const end = new Date(d); end.setDate(d.getDate() + 6);
  const weekNum = getISOWeekNumber(d);
  const fmt = dt => dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  return `W${weekNum} · ${fmt(d)} – ${fmt(end)}`;
}

// ─── Monday Reset Logic ────────────────────────────────────────────

function checkWeekRollover() {
  const now = new Date();
  const currentWeek = getWeekKey(now);
  const lastWeek = load(KEYS.week, null);

  if (lastWeek && lastWeek !== currentWeek) {
    // Archive previous week
    const workouts = load(KEYS.workouts, []);
    const nec = workouts.filter(w => w.type === 'necessary');
    const opt = workouts.filter(w => w.type === 'optional');
    const necDone = nec.filter(w => w.checked).length;
    const optDone = opt.filter(w => w.checked).length;
    const pct = nec.length > 0 ? Math.round((necDone / nec.length) * 100) : 0;

    const entry = {
      week: lastWeek,
      necDone, necTotal: nec.length,
      optDone, optTotal: opt.length,
      pct
    };

    const hist = load(KEYS.history, []);
    hist.unshift(entry);
    save(KEYS.history, hist);

    // Uncheck all workouts
    workouts.forEach(w => w.checked = false);
    save(KEYS.workouts, workouts);
  }

  save(KEYS.week, currentWeek);
  return currentWeek;
}

// ─── Render ────────────────────────────────────────────────────────

function render() {
  const workouts = load(KEYS.workouts, []);
  const nec = workouts.filter(w => w.type === 'necessary');
  const opt = workouts.filter(w => w.type === 'optional');
  const necDone = nec.filter(w => w.checked).length;
  const optDone = opt.filter(w => w.checked).length;

  // Status
  let state = 'red';
  let labelText = 'Not started';
  let subText = necDone === 0 ? 'Complete your non-negotiables' : `${necDone} of ${nec.length} done — keep going`;
  if (nec.length === 0 || necDone === 0) { state = 'red'; labelText = 'Not started'; }
  else if (necDone < nec.length) { state = 'yellow'; labelText = 'In progress'; }
  else { state = 'green'; labelText = 'Week complete ✓'; subText = optDone > 0 ? `+${optDone} bonus workout${optDone>1?'s':''} done!` : 'All non-negotiables done!'; }

  const sb = document.getElementById('statusBar');
  sb.className = 'status-bar ' + state;
  document.getElementById('statusLabel').textContent = labelText;
  document.getElementById('statusSub').textContent = subText;

  // Ring
  const pct = nec.length > 0 ? necDone / nec.length : 0;
  const circumference = 106.8;
  const offset = circumference - pct * circumference;
  const fill = document.getElementById('ringFill');
  fill.style.strokeDashoffset = offset;
  fill.style.stroke = state === 'green' ? 'var(--green)' : state === 'yellow' ? 'var(--yellow)' : 'var(--red)';
  document.getElementById('ringLabel').textContent = Math.round(pct*100) + '%';

  // Badges
  const necBadgeEl = document.getElementById('necBadge');
  necBadgeEl.textContent = `${necDone} / ${nec.length}`;
  necBadgeEl.className = 'section-badge' + (necDone === nec.length && nec.length > 0 ? ' green' : '');
  document.getElementById('optBadge').textContent = `${optDone} / ${opt.length}`;

  // Lists
  renderList(nec, document.getElementById('necList'));
  renderList(opt, document.getElementById('optList'));

  // History
  renderHistory();
}

function renderList(items, container) {
  container.innerHTML = '';
  if (items.length === 0) {
    container.innerHTML = `<div style="color:var(--text-faint);font-size:13px;padding:12px 4px;">None yet — add one above.</div>`;
    return;
  }
  items.forEach(w => {
    const el = document.createElement('div');
    el.className = 'workout-item' + (w.checked ? ' checked' : '');
    el.dataset.id = w.id;
    el.innerHTML = `
      <div class="check-box" onclick="toggleWorkout('${w.id}')">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#0e1115" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="2.5,7 5.5,10 11.5,4"/>
        </svg>
      </div>
      <div class="workout-name" id="name-${w.id}">${escHtml(w.name)}</div>
      <div class="workout-actions">
        <button class="item-btn" onclick="renameWorkout('${w.id}')" title="Rename">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
        </button>
        <button class="item-btn" onclick="toggleType('${w.id}')" title="Move">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
        <button class="item-btn danger" onclick="deleteWorkout('${w.id}')" title="Delete">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6m4-6v6"/></svg>
        </button>
      </div>
    `;
    container.appendChild(el);
  });
}

function renderHistory() {
  const hist = load(KEYS.history, []);
  const el = document.getElementById('historyList');
  if (hist.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="icon">📊</div>No history yet.<br>Complete a week to see your results here.</div>`;
    return;
  }
  el.innerHTML = hist.map(h => {
    const dotClass = h.pct === 100 ? 'green' : h.pct > 0 ? 'yellow' : 'red';
    return `
    <div class="history-item">
      <div class="history-dot ${dotClass}"></div>
      <div class="history-info">
        <div class="week">${formatWeek(h.week)}</div>
        <div class="score">${h.necDone}/${h.necTotal} essential · ${h.optDone}/${h.optTotal} bonus</div>
      </div>
      <div class="history-pct" style="color:${dotClass==='green'?'var(--green)':dotClass==='yellow'?'var(--yellow)':'var(--red)'}">${h.pct}%</div>
    </div>`;
  }).join('');
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─── Actions ───────────────────────────────────────────────────────

function addWorkout() {
  const input = document.getElementById('addInput');
  const name = input.value.trim();
  if (!name) return;
  const workouts = load(KEYS.workouts, []);
  workouts.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), name, type: newItemType, checked: false });
  save(KEYS.workouts, workouts);
  input.value = '';
  render();
}

function toggleWorkout(id) {
  const workouts = load(KEYS.workouts, []);
  const w = workouts.find(x => x.id === id);
  if (w) { w.checked = !w.checked; save(KEYS.workouts, workouts); render(); }
}

function deleteWorkout(id) {
  const workouts = load(KEYS.workouts, []).filter(x => x.id !== id);
  save(KEYS.workouts, workouts);
  render();
}

function toggleType(id) {
  const workouts = load(KEYS.workouts, []);
  const w = workouts.find(x => x.id === id);
  if (w) { w.type = w.type === 'necessary' ? 'optional' : 'necessary'; save(KEYS.workouts, workouts); render(); }
}

function renameWorkout(id) {
  const nameEl = document.getElementById('name-' + id);
  if (!nameEl) return;
  const current = nameEl.textContent;
  const inp = document.createElement('input');
  inp.className = 'rename-input';
  inp.value = current;
  nameEl.replaceWith(inp);
  inp.focus(); inp.select();
  const commit = () => {
    const newName = inp.value.trim() || current;
    const workouts = load(KEYS.workouts, []);
    const w = workouts.find(x => x.id === id);
    if (w) { w.name = newName; save(KEYS.workouts, workouts); }
    render();
  };
  inp.onblur = commit;
  inp.onkeydown = e => { if (e.key === 'Enter') inp.blur(); if (e.key === 'Escape') { inp.value = current; inp.blur(); } };
}

function selectType(type) {
  newItemType = type;
  document.getElementById('chipNec').className = 'type-chip' + (type==='necessary'?' selected-necessary':'');
  document.getElementById('chipOpt').className = 'type-chip' + (type==='optional'?' selected-optional':'');
}

// ─── Tabs ──────────────────────────────────────────────────────────

function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view-' + name).classList.add('active');
}

// ─── Settings ──────────────────────────────────────────────────────

function openSettings() { document.getElementById('settingsModal').classList.add('open'); }
function closeSettings(e) {
  if (e.target === document.getElementById('settingsModal'))
    document.getElementById('settingsModal').classList.remove('open');
}

function exportHistory() {
  const data = {
    workouts: load(KEYS.workouts, []),
    history: load(KEYS.history, []),
    week: load(KEYS.week, null),
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `streak-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importHistory() { document.getElementById('importFile').click(); }

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.workouts) save(KEYS.workouts, data.workouts);
      if (data.history)  save(KEYS.history, data.history);
      if (data.week)     save(KEYS.week, data.week);
      render();
      document.getElementById('settingsModal').classList.remove('open');
      alert('Data imported successfully!');
    } catch { alert('Invalid backup file.'); }
  };
  r.readAsText(file);
  e.target.value = '';
}

function confirmReset() {
  if (confirm('Delete ALL workout data and history? This cannot be undone.')) {
    [KEYS.workouts, KEYS.history, KEYS.week].forEach(k => localStorage.removeItem(k));
    render();
    document.getElementById('settingsModal').classList.remove('open');
  }
}

// ─── Week Label ────────────────────────────────────────────────────

function updateWeekLabel(weekKey) {
  document.getElementById('weekLabel').textContent = 'Week of ' + formatWeek(weekKey);
}

// ─── Init ──────────────────────────────────────────────────────────

(async () => {
  // Request persistent storage
  if (navigator.storage && navigator.storage.persist) {
    await navigator.storage.persist();
  }
  const currentWeek = checkWeekRollover();
  updateWeekLabel(currentWeek);
  render();
})();

// ─── Service Worker (via Blob) ─────────────────────────────────────

if ('serviceWorker' in navigator) {
  const swCode = `
const CACHE = 'streak-v1';
const FILES = [self.location.href];

self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll(FILES)).then(() => self.skipWaiting()));
});
self.addEventListener('activate', e => {
  e.waitUntil(clients.claim());
});
self.addEventListener('fetch', e => {
  e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
});
  `;
  const swBlob = new Blob([swCode], {type: 'application/javascript'});
  const swUrl  = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
